def supabaseUrl = ""
def supabaseAnonKey = ""

// 1. Read from root .env file if present (developer local override, gitignored)
def envFile = rootProject.file(".env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.startsWith("SUPABASE_URL=")) {
            def raw = trimmed.substring("SUPABASE_URL=".length()).trim()
            if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
                raw = raw.substring(1, raw.length() - 1).trim()
            }
            while (raw.endsWith('/')) {
                raw = raw.substring(0, raw.length() - 1)
            }
            if (raw.endsWith('/rest/v1')) {
                raw = raw.substring(0, raw.length() - '/rest/v1'.length())
            } else if (raw.endsWith('/auth/v1')) {
                raw = raw.substring(0, raw.length() - '/auth/v1'.length())
            } else if (raw.endsWith('/v1')) {
                raw = raw.substring(0, raw.length() - '/v1'.length())
            }
            while (raw.endsWith('/')) {
                raw = raw.substring(0, raw.length() - 1)
            }
            supabaseUrl = raw
        } else if (trimmed.startsWith("SUPABASE_ANON_KEY=")) {
            def raw = trimmed.substring("SUPABASE_ANON_KEY=".length()).trim()
            if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
                raw = raw.substring(1, raw.length() - 1).trim()
            }
            supabaseAnonKey = raw
        }
    }
}

// 2. Check System environment variables (e.g. CI/CD or developer OS environment)
if (supabaseUrl.isEmpty() && System.getenv("SUPABASE_URL") != null) {
    supabaseUrl = System.getenv("SUPABASE_URL").trim()
}
if (supabaseAnonKey.isEmpty() && System.getenv("SUPABASE_ANON_KEY") != null) {
    supabaseAnonKey = System.getenv("SUPABASE_ANON_KEY").trim()
}

// 3. Check Gradle project properties (e.g. -PsupabaseUrl=... -PsupabaseAnonKey=...)
if (supabaseUrl.isEmpty() && project.hasProperty("supabaseUrl")) {
    supabaseUrl = project.property("supabaseUrl").toString().trim()
}
if (supabaseAnonKey.isEmpty() && project.hasProperty("supabaseAnonKey")) {
    supabaseAnonKey = project.property("supabaseAnonKey").toString().trim()
}

// 4. Fallback: Fetch configuration from Vercel endpoint if not provided locally
if (supabaseUrl.isEmpty() || supabaseAnonKey.isEmpty()) {
    try {
        def vercelConfigUrl = new URL("https://shorashim-invite.vercel.app/api/config")
        def connection = (HttpURLConnection) vercelConfigUrl.openConnection()
        connection.requestMethod = "GET"
        connection.connectTimeout = 4000
        connection.readTimeout = 4000
        if (connection.responseCode == 200) {
            def text = connection.inputStream.text
            def parsed = new groovy.json.JsonSlurper().parseText(text)
            if (supabaseUrl.isEmpty() && parsed.supabaseUrl) {
                supabaseUrl = parsed.supabaseUrl.toString().trim()
            }
            if (supabaseAnonKey.isEmpty() && parsed.supabaseAnonKey) {
                supabaseAnonKey = parsed.supabaseAnonKey.toString().trim()
            }
        }
    } catch (Exception ignored) {
        // Build continues
    }
}

android {
    namespace 'com.shorashim'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.remember_me"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
